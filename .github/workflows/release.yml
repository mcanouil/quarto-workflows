name: Release

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: false
      APP_KEY:
        description: "GitHub App private key"
        required: false
    inputs:
      version:
        description: "Version bump type (patch/minor/major) - used for extensions only"
        required: false
        default: "minor"
        type: string
      repo-type:
        description: "Repo type (auto/extension/project) - 'auto' detects from the repo name and owned manifest"
        required: false
        default: "auto"
        type: string
      quarto:
        description: "Quarto version"
        required: false
        default: "release"
        type: string
      gh-app-id:
        description: "GitHub App ID"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    env:
      BRANCH: ci/bump-version
      COMMIT: "ci: bump version for release :rocket:"
      BUMP_VERSION: ${{ inputs.version }}

    outputs:
      version: ${{ steps.bump-version.outputs.version }}
      release_title: ${{ steps.bump-version.outputs.release_title }}
      release_notes: ${{ steps.bump-version.outputs.release_notes }}
      summary: ${{ steps.bump-version.outputs.summary }}
      repo_type: ${{ steps.detect-project.outputs.repo_type }}
      extension_name: ${{ steps.detect-project.outputs.extension_name }}
      has_docs: ${{ steps.detect-project.outputs.has_docs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Git User
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@main
        id: setup-git-user
        with:
          gh-app-id: ${{ inputs.gh-app-id }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Detect project type
        id: detect-project
        env:
          REQUESTED_TYPE: ${{ inputs.repo-type }}
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY}"
          PREFIX="${GITHUB_REPOSITORY_OWNER}/quarto-"

          # Derive the owned extension name from the repo name
          # (owner/quarto-<name> -> _extensions/<name>/_extension.yml). A project
          # that merely USES extensions installs third-party deps under other
          # subdir names, so directory presence alone is not enough.
          BASE="${REPO#"${PREFIX}"}"
          EXTENSION=""
          if [ "${BASE}" != "${REPO}" ]; then
            for cand in "${BASE#revealjs-}" "${BASE}"; do
              if [ -f "_extensions/${cand}/_extension.yml" ]; then
                EXTENSION="${cand}"
                break
              fi
            done
          fi

          case "${REQUESTED_TYPE}" in
            auto)
              if [ -n "${EXTENSION}" ]; then
                REPO_TYPE="extension"
              else
                REPO_TYPE="project"
                if [ -d "_extensions" ]; then
                  echo "Found _extensions/ but no owned manifest for '${BASE}'; treating as project."
                fi
              fi
              ;;
            extension)
              if [ -z "${EXTENSION}" ]; then
                echo "::error::repo-type='extension' but no owned manifest _extensions/<name>/_extension.yml was found for '${BASE}'"
                exit 1
              fi
              REPO_TYPE="extension"
              ;;
            project)
              REPO_TYPE="project"
              EXTENSION=""
              ;;
            *)
              echo "::error::Invalid repo-type '${REQUESTED_TYPE}' (expected auto/extension/project)"
              exit 1
              ;;
          esac

          # A documentation website under docs/ takes over GitHub Pages, and the
          # Pages workflow deploys it from the release tag. The root
          # project is then rendered as a check only, since example.qmd and
          # template.qmd are starting points to copy rather than pages to
          # publish.
          if [ -f "docs/_quarto.yml" ]; then
            HAS_DOCS="true"
          else
            HAS_DOCS="false"
          fi

          echo "Requested repo type: ${REQUESTED_TYPE}"
          echo "Repo type: ${REPO_TYPE}"
          echo "Extension name: ${EXTENSION}"
          echo "Documentation website: ${HAS_DOCS}"
          {
            echo "repo_type=${REPO_TYPE}"
            echo "extension_name=${EXTENSION}"
            echo "has_docs=${HAS_DOCS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Bump Version
        id: bump-version
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
          REPO_TYPE: ${{ steps.detect-project.outputs.repo_type }}
          EXTENSION: ${{ steps.detect-project.outputs.extension_name }}
        shell: bash
        run: |
          if git show-ref --quiet "refs/heads/${BRANCH}"; then
            echo "Branch ${BRANCH} already exists."
            git branch -D "${BRANCH}"
            git push origin --delete "${BRANCH}"
          fi
          git checkout -b "${BRANCH}"

          DATE=$(date +%Y-%m-%d)

          if [ "${REPO_TYPE}" = "extension" ]; then
            # Semantic versioning for extensions
            MANIFEST="_extensions/${EXTENSION}/_extension.yml"
            echo "Manifest: ${MANIFEST}"
            CURRENT_VERSION=$(grep "^version:" "${MANIFEST}" | sed 's/version: //;s/"//g')
            echo "Current Version: ${CURRENT_VERSION}"
            if [ -z "${CURRENT_VERSION}" ]; then
              echo "::error::No 'version:' field found in ${MANIFEST}"
              exit 1
            fi
            MAJOR=$(echo "${CURRENT_VERSION}" | cut -d. -f1)
            MINOR=$(echo "${CURRENT_VERSION}" | cut -d. -f2)
            PATCH=$(echo "${CURRENT_VERSION}" | cut -d. -f3)
            echo "Bumping Version: ${BUMP_VERSION}"
            case "${BUMP_VERSION}" in
              "major")
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              "minor")
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "New Version: ${VERSION}"
            sed -i "s/^version:.*/version: ${VERSION}/" "${MANIFEST}"
            sed -i "s/^version:.*/version: ${VERSION}/" CITATION.cff
            sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
            REPO="${GITHUB_REPOSITORY}"
            for file in README.md template.qmd example.qmd; do
              if [ -f "${file}" ]; then
                sed -i "s|${REPO}@[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*|${REPO}@${VERSION}|g" "${file}"
                sed -i -E "/quarto (add|use template)/{s|([^/])${REPO}([^@/])|\1${REPO}@${VERSION}\2|g; s|([^/])${REPO}\$|\1${REPO}@${VERSION}|g; s|^${REPO}([^@/])|${REPO}@${VERSION}\1|g; s|^${REPO}\$|${REPO}@${VERSION}|g}" "${file}"
                git add "${file}" || echo "No changes to add"
              fi
            done
            git add CITATION.cff || echo "No changes to add"
            git add "${MANIFEST}" || echo "No changes to add"

            RELEASE_TITLE=${EXTENSION^^}
            RELEASE_TITLE="${RELEASE_TITLE//-/ } ${VERSION}"
          else
            # Date-based versioning for projects
            CURRENT_DATE=$(date +%Y-%m-%d)
            PREV_DATE=$(grep '^date-released:' CITATION.cff | awk '{print $2}' | tr -d '"')
            VERSION=$(grep '^version:' CITATION.cff | awk '{print $2}')
            if [ "${PREV_DATE}" = "${CURRENT_DATE}" ]; then
              if [[ "${VERSION}" =~ -([0-9]+)$ ]]; then
                NUMBER=$(( BASH_REMATCH[1] + 1 ))
                VERSION="${VERSION%-*}-${NUMBER}"
              else
                VERSION="${VERSION}-2"
              fi
            else
              VERSION=${CURRENT_DATE//-/.}
            fi
            sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
            sed -i "s/^version:.*/version: ${VERSION}/" CITATION.cff
            git add CITATION.cff || echo "No changes to add"
            RELEASE_TITLE="${DATE}"
          fi

          # Shared: update CHANGELOG.md
          RELEASE_NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            RELEASE_NOTES=$(awk '/^## Unreleased/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md | sed '/./,$!d' | head -c 10000)
            if [ -n "${RELEASE_NOTES}" ]; then
              sed -i "s/^## Unreleased$/## ${VERSION} (${DATE})/" CHANGELOG.md
              sed -i "/^## ${VERSION} (${DATE})$/i\\
          ## Unreleased\\
          " CHANGELOG.md
              git add CHANGELOG.md
            fi
          fi

          git commit -m "${COMMIT}" || echo "No changes to commit"
          git push --force origin "${BRANCH}" || echo "No changes to push"

          sleep 5
          gh pr create --fill-first --base "${GITHUB_REF_NAME}" --head "${BRANCH}" --label "Type: CI/CD :robot:"
          sleep 5
          gh pr merge --auto --squash --delete-branch
          sleep 5

          # Build version bump summary
          SUMMARY="## Version Bump\n\n"
          SUMMARY+="| Field | Value |\n"
          SUMMARY+="|-------|--------|\n"
          if [ "${REPO_TYPE}" = "extension" ]; then
            SUMMARY+="| Extension | \`${EXTENSION}\` |\n"
            SUMMARY+="| Previous Version | \`${CURRENT_VERSION}\` |\n"
            SUMMARY+="| New Version | \`${VERSION}\` |\n"
            SUMMARY+="| Bump Type | \`${BUMP_VERSION}\` |\n"
          else
            SUMMARY+="| New Version | \`${VERSION}\` |\n"
          fi
          SUMMARY+="| Release Date | \`${DATE}\` |\n"

          {
            echo "version=${VERSION}"
            echo "release_title=${RELEASE_TITLE}"
            echo "summary=${SUMMARY}"
          } >> "${GITHUB_OUTPUT}"
          if [ -n "${RELEASE_NOTES}" ]; then
            {
              echo "release_notes<<RELEASE_NOTES_DELIM"
              echo "${RELEASE_NOTES}"
              echo "RELEASE_NOTES_DELIM"
            } >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    runs-on: ubuntu-latest

    needs: bump-version

    # This job renders and packages; it never deploys. A job cannot drop its
    # `environment` conditionally, and claiming `github-pages` while deploying
    # nothing would record a deployment that never happened, so the deployment
    # itself lives in publish-pages (no docs/) or deploy-pages (docs/) below.
    env:
      QUARTOVERSION: ${{ inputs.quarto }}
      REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
      HAS_DOCS: ${{ needs.bump-version.outputs.has_docs }}

    outputs:
      summary: ${{ steps.deployment-summary.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Git User
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@main
        id: setup-git-user
        with:
          gh-app-id: ${{ inputs.gh-app-id }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update branch
        run: |
          git fetch --all
          git checkout "${GITHUB_REF_NAME}"
          git pull origin "${GITHUB_REF_NAME}"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "${{ env.QUARTOVERSION }}"
          tinytex: false

      - name: Detect project directory and configure
        id: detect-project-dir
        shell: bash
        run: |
          # Always the repository root. A documentation website under docs/ is
          # rendered and deployed by the Pages workflow instead, and the
          # root project then serves as a render check only.
          PROJECT_DIR="."
          echo "Using root as project directory"
          if [ "${HAS_DOCS}" = "true" ]; then
            echo "docs/_quarto.yml found: the root project is rendered as a check and not deployed."
          fi

          # Read project type and output directory from Quarto (resolves defaults)
          INSPECT_JSON=$(quarto inspect "${PROJECT_DIR}" 2>/dev/null || echo '{}')
          QUARTO_PROJECT_TYPE=$(echo "${INSPECT_JSON}" | jq -r '.config.project.type // "default"')
          OUTPUT_DIR=$(echo "${INSPECT_JSON}" | jq -r '.config.project["output-dir"] // empty')

          # Default project with no output-dir: fall back to _site and create a
          # minimal _quarto.yml only when none exists. Never overwrite existing config.
          if [ -z "${OUTPUT_DIR}" ]; then
            OUTPUT_DIR="_site"
            if [ ! -f "${PROJECT_DIR}/_quarto.yml" ]; then
              printf 'project:\n  output-dir: %s\n' "${OUTPUT_DIR}" > "${PROJECT_DIR}/_quarto.yml"
            fi
          fi

          OUTPUT_DIRECTORY="${OUTPUT_DIR}"

          # A documentation website is a Quarto project of its own, but the root
          # project scan does not skip a subdirectory that has one. Left alone,
          # every page under docs/ is rendered a second time here, without the
          # configuration, theme, and extensions that make it work, and lands in
          # the archive attached to the release. Exclude it, so this render is
          # the example check it claims to be.
          if [ "${HAS_DOCS}" = "true" ]; then
            if [ "$(yq eval '.project.render' "${PROJECT_DIR}/_quarto.yml")" = "null" ]; then
              yq eval -i '.project.render = ["*.qmd", "!docs/"]' "${PROJECT_DIR}/_quarto.yml"
            elif ! yq eval '.project.render[] | select(. == "!docs/")' "${PROJECT_DIR}/_quarto.yml" | grep -q 'docs/'; then
              yq eval -i '.project.render += ["!docs/"]' "${PROJECT_DIR}/_quarto.yml"
            fi
          fi

          echo "Quarto project type: ${QUARTO_PROJECT_TYPE}"
          echo "Output directory: ${OUTPUT_DIRECTORY}"
          echo "_quarto.yml:"
          cat "${PROJECT_DIR}/_quarto.yml"
          {
            echo "project_dir=${PROJECT_DIR}"
            echo "output_directory=${OUTPUT_DIRECTORY}"
            echo "quarto_project_type=${QUARTO_PROJECT_TYPE}"
          } >> "${GITHUB_OUTPUT}"

      # Chrome is installed unconditionally here, since decktape drives it to
      # turn slides into PDF whatever the engines and formats turn out to be.
      - name: Set up compute environment
        id: compute
        uses: mcanouil/quarto-workflows/.github/actions/setup-quarto-compute@main
        with:
          path: ${{ steps.detect-project-dir.outputs.project_dir }}
          chromium: "true"

      # A presentation repository converts every deck it renders, while an
      # extension only converts the decks that exercise the format it ships, so
      # plain `revealjs` output is left alone there.
      - name: Check decktape need
        id: check-decktape
        env:
          FORMATS: ${{ steps.compute.outputs.formats }}
        shell: bash
        run: |
          NEED_DECKTAPE=false
          if [ "${REPO_TYPE}" = "project" ]; then
            if echo "${FORMATS}" | grep -q "revealjs"; then
              NEED_DECKTAPE=true
            fi
          else
            for fmt in ${FORMATS}; do
              if echo "${fmt}" | grep -q "revealjs" && [ "${fmt}" != "revealjs" ]; then
                NEED_DECKTAPE=true
                break
              fi
            done
          fi

          echo "Need Decktape: ${NEED_DECKTAPE}"
          echo "need_decktape=${NEED_DECKTAPE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: ${{ steps.check-decktape.outputs.need_decktape == 'true' }}
        uses: actions/setup-node@v7

      - name: Checkout slides-to-pdf script
        if: ${{ steps.check-decktape.outputs.need_decktape == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: mcanouil/quarto-workflows
          sparse-checkout: .github/workflows/assets/slides-to-pdf.sh
          sparse-checkout-cone-mode: false
          path: workflows

      - name: Exclude CHANGELOG.md from render
        env:
          PROJECT_DIR: ${{ steps.detect-project-dir.outputs.project_dir }}
          # The inputs detection already read, rather than a third inspection of
          # the same project. Nothing between the two steps touches _quarto.yml.
          INPUT_FILES: ${{ steps.compute.outputs.input-files }}
        shell: bash
        run: |
          QUARTO_YML="${PROJECT_DIR}/_quarto.yml"
          if [ ! -f "${PROJECT_DIR}/CHANGELOG.md" ]; then
            echo "No CHANGELOG.md in ${PROJECT_DIR}, nothing to exclude."
            exit 0
          fi
          if [ ! -f "${QUARTO_YML}" ]; then
            echo "No ${QUARTO_YML}, nothing to exclude."
            exit 0
          fi

          if yq eval '.project.render' "${QUARTO_YML}" | grep -q "null"; then
            # No render targets: rebuild the default input set minus CHANGELOG.md.
            # An exclusion-only list would render nothing, so we list includes explicitly.
            mapfile -t INPUTS < <(printf '%s\n' "${INPUT_FILES}" | sed '/^$/d')
            RENDER=()
            for f in "${INPUTS[@]}"; do
              rel=$(realpath --relative-to="${PROJECT_DIR}" "${f}")
              if [ "${rel}" = "CHANGELOG.md" ]; then
                continue
              fi
              RENDER+=("${rel}")
            done
            # Only write render targets when inputs were detected; an empty list
            # would render nothing, so leave _quarto.yml untouched in that case.
            if [ "${#RENDER[@]}" -gt 0 ]; then
              yq eval '.project.render = []' -i "${QUARTO_YML}"
              for rel in "${RENDER[@]}"; do
                yq eval ".project.render += [\"${rel}\"]" -i "${QUARTO_YML}"
              done
            else
              echo "No inputs were detected; leaving render targets unchanged."
            fi
          else
            # Render targets already defined: append the exclusion if not present.
            if ! yq eval '.project.render[] | select(. == "!CHANGELOG.md")' "${QUARTO_YML}" | grep -q "!CHANGELOG.md"; then
              yq eval '.project.render += ["!CHANGELOG.md"]' -i "${QUARTO_YML}"
            fi
          fi

          echo "Render targets after CHANGELOG.md exclusion:"
          cat "${QUARTO_YML}"

      - name: Render Quarto Project
        id: render-quarto
        env:
          PROJECT_DIR: ${{ steps.detect-project-dir.outputs.project_dir }}
          OUTPUT_DIRECTORY: ${{ steps.detect-project-dir.outputs.output_directory }}
          QUARTO_PROJECT_TYPE: ${{ steps.detect-project-dir.outputs.quarto_project_type }}
          REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
          FORMATS: ${{ steps.compute.outputs.formats }}
          NEED_DECKTAPE: ${{ steps.check-decktape.outputs.need_decktape }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          EXTENSION_NAME: ${{ needs.bump-version.outputs.extension_name }}
          ACTIONS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
        shell: bash
        run: |
          if [ "${NEED_DECKTAPE}" = "true" ]; then
            npm install -g decktape

            # Add post-render script to _quarto.yml if not using docs/
            if [ "${PROJECT_DIR}" = "." ]; then
              SLIDES_SCRIPT="workflows/.github/workflows/assets/slides-to-pdf.sh"
              if yq eval '.project.post-render' _quarto.yml | grep -q "null"; then
                yq eval ".project.post-render = [\"${SLIDES_SCRIPT}\"]" -i _quarto.yml
              else
                if ! yq eval ".project.post-render[] | select(. == \"${SLIDES_SCRIPT}\")" _quarto.yml | grep -q "${SLIDES_SCRIPT}"; then
                  yq eval ".project.post-render += [\"${SLIDES_SCRIPT}\"]" -i _quarto.yml
                fi
              fi
            fi
          fi

          echo "Final _quarto.yml:"
          cat "${PROJECT_DIR}/_quarto.yml"

          if [ "${ACTIONS_RUNNER_DEBUG}" = "true" ] || [ "${ACTIONS_STEP_DEBUG}" = "true" ]; then
            export QUARTO_DENO_V8_OPTIONS=--stack-trace-limit=100
            export QUARTO_PRINT_STACK=true
            export QUARTO_LOG_LEVEL=DEBUG
          fi

          # Non-default projects (website/book/...) render as a whole project.
          # Default projects render each detected format individually.
          if [ "${QUARTO_PROJECT_TYPE}" != "default" ]; then
            echo "::group::Rendering project (${QUARTO_PROJECT_TYPE})"
            quarto render "${PROJECT_DIR}"
            echo "::endgroup::"
          elif [ -n "${FORMATS}" ]; then
            for format in ${FORMATS}; do
              echo "::group::Rendering ${format}"
              quarto render "${PROJECT_DIR}" --to "${format}"
              echo "::endgroup::"
            done
          else
            echo "::group::Rendering (default)"
            quarto render "${PROJECT_DIR}"
            echo "::endgroup::"
          fi

          # Package rendered output. With a documentation website present this
          # is the rendered example rather than the published site, so it is
          # named for what it actually contains.
          if [ "${HAS_DOCS}" = "true" ]; then
            SITE_ARCHIVE="example-render.tar.gz"
          else
            SITE_ARCHIVE="gh-pages.tar.gz"
          fi
          tar -czf "${SITE_ARCHIVE}" -C "${OUTPUT_DIRECTORY}" .
          echo "site_archive=${SITE_ARCHIVE}" >> "${GITHUB_OUTPUT}"

          # Package _extensions/ if present (named as {extension}-v{version}.tar.gz and .zip)
          if [ "${REPO_TYPE}" = "extension" ] && [ -d "_extensions" ]; then
            ASSET_NAME="${EXTENSION_NAME}-v${VERSION}"
            tar -czf "${ASSET_NAME}.tar.gz" _extensions/
            zip -qr "${ASSET_NAME}.zip" _extensions/
            echo "extensions_asset_exists=true" >> "${GITHUB_OUTPUT}"
            echo "extensions_asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "extensions_asset_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          # Check for slides assets (created by post-render script)
          if [ -d "release_assets" ]; then
            echo "slides_assets_exists=true" >> "${GITHUB_OUTPUT}"
            echo "release_assets_path=$(pwd)/release_assets" >> "${GITHUB_OUTPUT}"
          else
            echo "slides_assets_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # Skipped when the repository has a documentation website: the deploy-pages
      # job below publishes docs/ from the release tag instead, and the render
      # above was only a check. Without one, the rendered output is staged here
      # and publish-pages deploys it.
      - name: Configure GitHub Pages
        if: ${{ env.HAS_DOCS != 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        id: upload-artifact
        if: ${{ env.HAS_DOCS != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ steps.detect-project-dir.outputs.output_directory }}"

      - name: Upload release assets (slides + extensions)
        uses: actions/upload-artifact@v7
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'true' && steps.render-quarto.outputs.extensions_asset_exists == 'true' }}
        with:
          name: release-assets
          path: |
            ${{ steps.render-quarto.outputs.release_assets_path }}
            ${{ steps.render-quarto.outputs.site_archive }}
            ${{ steps.render-quarto.outputs.extensions_asset_name }}.tar.gz
            ${{ steps.render-quarto.outputs.extensions_asset_name }}.zip

      - name: Upload release assets (extensions only)
        uses: actions/upload-artifact@v7
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'false' && steps.render-quarto.outputs.extensions_asset_exists == 'true' }}
        with:
          name: release-assets
          path: |
            ${{ steps.render-quarto.outputs.site_archive }}
            ${{ steps.render-quarto.outputs.extensions_asset_name }}.tar.gz
            ${{ steps.render-quarto.outputs.extensions_asset_name }}.zip

      - name: Upload release assets (slides only)
        uses: actions/upload-artifact@v7
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'true' && steps.render-quarto.outputs.extensions_asset_exists == 'false' }}
        with:
          name: release-assets
          path: |
            ${{ steps.render-quarto.outputs.release_assets_path }}
            ${{ steps.render-quarto.outputs.site_archive }}

      - name: Upload release assets (default)
        uses: actions/upload-artifact@v7
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'false' && steps.render-quarto.outputs.extensions_asset_exists == 'false' }}
        with:
          name: release-assets
          path: |
            ${{ steps.render-quarto.outputs.site_archive }}

      - name: Update template thumbnail
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'true' }}
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
          OUTPUT_DIRECTORY: ${{ steps.detect-project-dir.outputs.output_directory }}
          BRANCH: ci/update-thumbs
          COMMIT: "ci: update thumbs :art:"
        shell: bash
        run: |
          if [ -f "${OUTPUT_DIRECTORY}/index.png" ]; then
            mv -f "${OUTPUT_DIRECTORY}/index.png" .github/template.png
            if git show-ref --quiet "refs/heads/${BRANCH}"; then
              echo "Branch ${BRANCH} already exists."
              git branch -D "${BRANCH}"
              git push origin --delete "${BRANCH}"
            fi
            git checkout -b "${BRANCH}"
            git add .github/template.png || echo "No changes to add"
            if ! git diff --cached --quiet; then
              git commit -m "${COMMIT}"
              git push --force origin "${BRANCH}"
              gh pr create --fill-first --base "${GITHUB_REF_NAME}" --head "${BRANCH}" --label "Type: CI/CD :robot:"
              sleep 5
              gh pr merge --auto --squash --delete-branch
              sleep 5
            else
              echo "No changes to commit."
            fi
          fi

      # Formats and engines are reported by the compute action itself, in this
      # job's own summary, so they are not repeated here.
      - name: Add deployment summary
        id: deployment-summary
        shell: bash
        run: |
          SUMMARY="## Deployment\n\n"
          SUMMARY+="| Field | Value |\n"
          SUMMARY+="|-------|--------|\n"
          SUMMARY+="| Quarto Version | \`${QUARTOVERSION}\` |\n"
          if [ "${HAS_DOCS}" = "true" ]; then
            SUMMARY+="| GitHub Pages | Deployed from \`docs/\` by the Pages workflow. |\n"
          else
            SUMMARY+="| GitHub Pages | Deployed by the Publish Pages job. |\n"
          fi
          echo "summary=${SUMMARY}" >> "${GITHUB_OUTPUT}"

  # A repository without docs/ publishes its rendered example or template to
  # Pages, as it always has. The deployment sits in its own job so the
  # github-pages environment is claimed only when something is deployed.
  publish-pages:
    runs-on: ubuntu-latest

    needs:
      - bump-version
      - deploy

    if: ${{ needs.bump-version.outputs.has_docs != 'true' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Pages deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|--------|"
            echo "| GitHub Pages URL | [${PAGE_URL}](${PAGE_URL}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    runs-on: ubuntu-latest

    needs:
      - bump-version
      - deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Git User
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@main
        id: setup-git-user
        with:
          gh-app-id: ${{ inputs.gh-app-id }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update branch
        run: |
          git fetch --all
          git checkout "${GITHUB_REF_NAME}"
          git pull origin "${GITHUB_REF_NAME}"

      - name: Download release assets
        id: download-release-assets-artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release_assets

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          RELEASE_TITLE: ${{ needs.bump-version.outputs.release_title }}
          RELEASE_NOTES: ${{ needs.bump-version.outputs.release_notes }}
          REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
        shell: bash
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("${file}")
          done < <(find release_assets -type f -print0)

          PREVIOUS_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null) || PREVIOUS_TAG=""
          GENERATE_NOTES_PAYLOAD=$(jq -n \
            --arg tag "${VERSION}" \
            --arg previous "${PREVIOUS_TAG}" \
            'if $previous == "" then {tag_name: $tag} else {tag_name: $tag, previous_tag_name: $previous} end'
          )
          AUTO_NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            --input - <<< "${GENERATE_NOTES_PAYLOAD}" \
            --jq '.body' 2>/dev/null) || AUTO_NOTES=""

          {
            if [ "${REPO_TYPE}" = "extension" ]; then
              echo "## Installation"
              echo ""
              echo '```bash'
              echo "quarto add ${GITHUB_REPOSITORY}@${VERSION}"
              echo '```'
              echo ""
            fi
            if [ -n "${RELEASE_NOTES}" ]; then
              echo "## Changelog"
              echo ""
              echo "${RELEASE_NOTES}"
              echo ""
            fi
            if [ -n "${AUTO_NOTES}" ]; then
              echo "${AUTO_NOTES}"
            fi
          } > release_notes.md

          gh release create "${VERSION}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            "${assets[@]}"

      - name: Display workflow summary
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          BUMP_SUMMARY: ${{ needs.bump-version.outputs.summary }}
          DEPLOY_SUMMARY: ${{ needs.deploy.outputs.summary }}
          REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
          EXTENSION: ${{ needs.bump-version.outputs.extension_name }}
        shell: bash
        run: |
          {
            echo "# Release Summary"
            echo ""
            echo "*Automated release completed successfully*"
            echo ""
            if [ "${REPO_TYPE}" = "extension" ]; then
              echo "### Extension Details"
              echo "- **Extension Name**: \`${EXTENSION}\`"
              echo "- **Version**: \`${VERSION}\`"
            else
              echo "### Project Details"
              echo "- **Version**: \`${VERSION}\`"
            fi
            echo ""
            echo "### Links"
            echo "- [GitHub Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
            # The Pages URL is written by whichever job deployed the site,
            # publish-pages or the Pages workflow, both of which run beside this
            # job rather than before it.
            echo ""
            echo "---"
            echo ""
            echo -e "${BUMP_SUMMARY}"
            echo ""
            echo -e "${DEPLOY_SUMMARY}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  # Publishes the documentation website from the tag the release job just
  # created, so the site describes the version users can install.
  deploy-pages:
    needs:
      - bump-version
      - release
    if: ${{ needs.bump-version.outputs.has_docs == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mcanouil/quarto-workflows/.github/workflows/pages.yml@main
    with:
      ref: ${{ needs.bump-version.outputs.version }}
      quarto: ${{ inputs.quarto }}
