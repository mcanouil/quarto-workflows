name: Release

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: false
      APP_KEY:
        description: "GitHub App private key"
        required: false
    inputs:
      version:
        description: "Version bump type (patch/minor/major) - used for extensions only"
        required: false
        default: "minor"
        type: string
      repo-type:
        description: "Repo type (auto/extension/project) - 'auto' detects from the repo name and owned manifest"
        required: false
        default: "auto"
        type: string
      quarto:
        description: "Quarto version"
        required: false
        default: "release"
        type: string
      gh-app-id:
        description: "GitHub App ID"
        required: false
        type: string
      merge-timeout:
        description: "Seconds to wait for the version bump pull request to merge"
        required: false
        default: 1800
        type: number
      notes-header:
        description: "Path of a template file in the caller, put first in the release body. Placeholders: {version}, {tag}, {date}, {repository}. Default: the install header for an extension, none for a project"
        required: false
        default: ""
        type: string
      pin-files:
        description: "Files whose <repository>[/<path>]@X.Y.Z pins follow the release, separated by spaces or new lines. Extensions only"
        required: false
        default: ""
        type: string
    outputs:
      tag:
        description: "Tag of the release"
        value: ${{ jobs.release.outputs.tag }}
      sha:
        description: "Commit of the release, the merged version bump"
        value: ${{ jobs.bump-version.outputs.merge_sha }}

# Declared per job rather than once here, so the job that renders the released
# project, which runs executed chunks and pre-render and post-render scripts the
# project controls, holds a read-only token. Only bump-version, thumbnail, and
# release write. A called workflow cannot exceed what the calling job granted,
# so these narrow the caller's block rather than widen it.

# A release bumps a version, pushes a branch, and creates a tag, so two of them
# at once would race over all three. Queue rather than cancel: a cancelled
# release leaves the bump branch and its pull request behind.
#
# The group is evaluated in the caller's repository, where a workflow named
# Release picking the obvious `release-<ref>` for itself would deadlock: the
# calling job would hold the group while waiting for this one to claim it. Hence
# the prefix.
concurrency:
  group: quarto-workflows-release-${{ github.ref }}
  cancel-in-progress: false

# Every job that writes resolves its own token, and each has to be told the same
# App id, so it is derived once here rather than in each of the three calls. The
# key and the fallback token stay at the call sites, since a workflow-level `env`
# cannot read `secrets`.
env:
  APP_ID: ${{ inputs.gh-app-id || vars.APP_ID }}

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Above merge-timeout, which this job spends polling: raising one raises
    # this.
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    env:
      # The files a user copies install lines from, whose pins the bump keeps
      # on the released version.
      INSTALL_FILES: "README.md template.qmd example.qmd"
      PIN_FILES: ${{ inputs.pin-files }}
      BUMP_VERSION: ${{ inputs.version }}

    outputs:
      version: ${{ steps.bump.outputs.version }}
      date: ${{ steps.bump.outputs.date }}
      merge_sha: ${{ steps.land.outputs.sha }}
      release_title: ${{ steps.title.outputs.release_title }}
      summary: ${{ steps.title.outputs.summary }}
      repo_type: ${{ steps.detect-project.outputs.repo_type }}
      extension_name: ${{ steps.detect-project.outputs.extension_name }}
      has_docs: ${{ steps.detect-project.outputs.has_docs }}

    steps:
      # A push made with the default GITHUB_TOKEN triggers no workflow, which
      # leaves the version bump pull request without the checks its auto-merge
      # waits for, so a repository with a GitHub App pushes as the App instead.
      - name: Get the token
        uses: mcanouil/release-actions/token@v1
        id: token
        with:
          app-id: ${{ env.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Detect project type
        id: detect-project
        env:
          REQUESTED_TYPE: ${{ inputs.repo-type }}
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY}"
          PREFIX="${GITHUB_REPOSITORY_OWNER}/quarto-"

          # Derive the owned extension name from the repo name
          # (owner/quarto-<name> -> _extensions/<name>/_extension.yml). A project
          # that merely USES extensions installs third-party deps under other
          # subdir names, so directory presence alone is not enough.
          BASE="${REPO#"${PREFIX}"}"
          EXTENSION=""
          if [ "${BASE}" != "${REPO}" ]; then
            for cand in "${BASE#revealjs-}" "${BASE}"; do
              if [ -f "_extensions/${cand}/_extension.yml" ]; then
                EXTENSION="${cand}"
                break
              fi
            done
          fi

          case "${REQUESTED_TYPE}" in
            auto)
              if [ -n "${EXTENSION}" ]; then
                REPO_TYPE="extension"
              else
                REPO_TYPE="project"
                if [ -d "_extensions" ]; then
                  echo "Found _extensions/ but no owned manifest for '${BASE}'; treating as project."
                fi
              fi
              ;;
            extension)
              if [ -z "${EXTENSION}" ]; then
                echo "::error::repo-type='extension' but no owned manifest _extensions/<name>/_extension.yml was found for '${BASE}'"
                exit 1
              fi
              REPO_TYPE="extension"
              ;;
            project)
              REPO_TYPE="project"
              EXTENSION=""
              ;;
            *)
              echo "::error::Invalid repo-type '${REQUESTED_TYPE}' (expected auto/extension/project)"
              exit 1
              ;;
          esac

          # A documentation website under docs/ takes over GitHub Pages, and the
          # Pages workflow deploys it from the release tag. The root
          # project is then rendered as a check only, since example.qmd and
          # template.qmd are starting points to copy rather than pages to
          # publish.
          if [ -f "docs/_quarto.yml" ]; then
            HAS_DOCS="true"
          else
            HAS_DOCS="false"
          fi

          echo "Requested repo type: ${REQUESTED_TYPE}"
          echo "Repo type: ${REPO_TYPE}"
          echo "Extension name: ${EXTENSION}"
          echo "Documentation website: ${HAS_DOCS}"
          {
            echo "repo_type=${REPO_TYPE}"
            echo "extension_name=${EXTENSION}"
            echo "has_docs=${HAS_DOCS}"
          } >> "${GITHUB_OUTPUT}"

      # An extension reads its version from its one-level manifest and bumps it
      # by the requested part; a project reads CITATION.cff and uses the date.
      # The presets write the manifest and CITATION.cff. Pins in the files a
      # user copies from are rewritten wherever they exist.
      # Each distinct path pinned in a pin-files entry, such as
      # <repository>/.github/actions/<name>, gets a target of its own, since a
      # target pattern is literal apart from {version}.
      - name: Build the bump targets
        id: targets
        env:
          REPO_TYPE: ${{ steps.detect-project.outputs.repo_type }}
        shell: bash
        run: |
          set -euo pipefail

          TARGETS_FILE="${RUNNER_TEMP}/bump-targets.yml"
          : > "${TARGETS_FILE}"
          if [ "${REPO_TYPE}" = "extension" ]; then
            ECOSYSTEMS="quarto-extension, citation"
            BUMP="${BUMP_VERSION}"
            for file in ${INSTALL_FILES}; do
              printf -- "- file: %s\n  pattern: '%s@{version}'\n  required: false\n" "${file}" "${GITHUB_REPOSITORY}" >> "${TARGETS_FILE}"
            done
            # The version part is the {version} form of release-actions bump.
            PIN_REGEX="${GITHUB_REPOSITORY//./\\.}(/[^@[:space:]\"']+)?@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?"
            mapfile -t LISTED < <(tr -s '[:space:]' '\n' <<< "${PIN_FILES}" | sed '/^$/d' | LC_ALL=C sort -u)
            for file in "${LISTED[@]}"; do
              if [ ! -f "${file}" ]; then
                echo "::error::pin-files lists '${file}', which is not a file in the repository."
                exit 1
              fi
              PINNED="$(grep -oE "${PIN_REGEX}" "${file}" | sed 's/@[^@]*$//' | LC_ALL=C sort -u || true)"
              if [ -z "${PINNED}" ]; then
                echo "::error::pin-files lists '${file}', which has no pin such as ${GITHUB_REPOSITORY}/.github/actions/<name>@X.Y.Z. Remove it from pin-files, or pin the reference to a release."
                exit 1
              fi
              while IFS= read -r pinned; do
                if [ "${pinned}" = "${GITHUB_REPOSITORY}" ] && [[ " ${INSTALL_FILES} " == *" ${file} "* ]]; then
                  continue
                fi
                printf -- "- file: %s\n  pattern: '%s@{version}'\n" "${file}" "${pinned}" >> "${TARGETS_FILE}"
              done <<< "${PINNED}"
            done
          else
            if [ -n "${PIN_FILES//[[:space:]]/}" ]; then
              echo "::error::pin-files is set, but a ${REPO_TYPE} is versioned by date, which a pin does not follow. Remove pin-files from the caller."
              exit 1
            fi
            ECOSYSTEMS="citation"
            BUMP="calver"
          fi
          echo "Ecosystems: ${ECOSYSTEMS}"
          cat "${TARGETS_FILE}"

          DELIM="TARGETS_$(openssl rand -hex 16)"
          {
            echo "bump=${BUMP}"
            echo "ecosystems=${ECOSYSTEMS}"
            echo "targets<<${DELIM}"
            cat "${TARGETS_FILE}"
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"

      # A release with nothing under "## Unreleased", or with no CHANGELOG.md at
      # all, goes out without a changelog section and leaves the file alone, as
      # it always has. Only "## Unreleased" counts, as before.
      - name: Choose the changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG=""
          if [ -f "CHANGELOG.md" ] &&
            [ -n "$(awk '/^## Unreleased/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md | tr -d '[:space:]')" ]; then
            CHANGELOG="CHANGELOG.md"
          else
            echo "No CHANGELOG.md, or nothing under its Unreleased heading: the release has no changelog section."
          fi
          echo "path=${CHANGELOG}" >> "${GITHUB_OUTPUT}"

      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ steps.targets.outputs.bump }}
          token: ${{ steps.token.outputs.token }}
          ecosystems: ${{ steps.targets.outputs.ecosystems }}
          targets: ${{ steps.targets.outputs.targets }}
          changelog: ${{ steps.changelog.outputs.path }}

      # The bump only replaces pins that exist. A new extension's install lines
      # have none yet, so the version is added after the repository name on
      # every `quarto add` or `quarto use template` line that lacks one.
      - name: Pin unpinned install lines
        id: pins
        if: ${{ steps.detect-project.outputs.repo_type == 'extension' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          PINNED=()
          for file in ${INSTALL_FILES}; do
            if [ -f "${file}" ]; then
              PINNED+=("${file}")
              sed -i -E "/quarto (add|use template)/{s|([^/])${REPO}([^@/])|\1${REPO}@${VERSION}\2|g; s|([^/])${REPO}\$|\1${REPO}@${VERSION}|g; s|^${REPO}([^@/])|${REPO}@${VERSION}\1|g; s|^${REPO}\$|${REPO}@${VERSION}|g}" "${file}"
            fi
          done
          {
            echo "files<<INSTALL_FILES_DELIM"
            printf '%s\n' "${PINNED[@]}"
            echo "INSTALL_FILES_DELIM"
          } >> "${GITHUB_OUTPUT}"

      # The release job runs on another runner, so the changelog section
      # travels as an artifact. It is empty when the release has no section.
      # Uploaded before the push, so a failure here leaves nothing behind.
      - name: Stage the release notes
        env:
          NOTES_FILE: ${{ steps.bump.outputs.notes-file }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-notes"
          cp "${NOTES_FILE}" "${RUNNER_TEMP}/release-notes/release-notes.md"

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/release-notes.md
          retention-days: 1
          overwrite: true

      # The install files are listed whole: the bump only rewrote the pins it
      # found, and the step above added the ones that were missing. Every job
      # after this one renders the merged commit and tags it, so land waits for
      # the merge: a tag cut while auto-merge still waited on the required
      # checks would point at the previous version's manifest.
      - name: Land the version bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          version: ${{ steps.bump.outputs.version }}
          files: |
            ${{ steps.bump.outputs.files }}
            ${{ steps.pins.outputs.files }}
          # Auto-merge waits for whatever checks the default branch requires,
          # so a repository whose suite outlasts the default raises this rather
          # than forking the workflow.
          merge-timeout: ${{ inputs.merge-timeout }}
          token: ${{ steps.token.outputs.token }}

      # A project titles its release with the date, and the release action
      # adds the count of a second release on the same day.
      - name: Compose the release title and summary
        id: title
        env:
          REPO_TYPE: ${{ steps.detect-project.outputs.repo_type }}
          EXTENSION: ${{ steps.detect-project.outputs.extension_name }}
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          DATE: ${{ steps.bump.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${REPO_TYPE}" = "extension" ]; then
            RELEASE_TITLE=${EXTENSION^^}
            RELEASE_TITLE="${RELEASE_TITLE//-/ } ${VERSION}"
          else
            RELEASE_TITLE="{date}{count}"
          fi

          SUMMARY="## Version Bump\n\n"
          SUMMARY+="| Field | Value |\n"
          SUMMARY+="|-------|--------|\n"
          if [ "${REPO_TYPE}" = "extension" ]; then
            SUMMARY+="| Extension | \`${EXTENSION}\` |\n"
            SUMMARY+="| Previous Version | \`${PREVIOUS}\` |\n"
            SUMMARY+="| New Version | \`${VERSION}\` |\n"
            SUMMARY+="| Bump Type | \`${BUMP_VERSION}\` |\n"
          else
            SUMMARY+="| New Version | \`${VERSION}\` |\n"
          fi
          SUMMARY+="| Release Date | \`${DATE}\` |\n"

          {
            echo "release_title=${RELEASE_TITLE}"
            echo "summary=${SUMMARY}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    needs: bump-version

    # This job renders and packages; it never deploys. A job cannot drop its
    # `environment` conditionally, and claiming `github-pages` while deploying
    # nothing would record a deployment that never happened, so the deployment
    # itself lives in publish-pages (no docs/) or deploy-pages (docs/) below.
    #
    # Read-only on contents, since everything past the checkout runs code the
    # released project controls. `pages: write` is what configure-pages needs to
    # stage the site for publish-pages. The one write this job used to make, the
    # template thumbnail, is now the thumbnail job below.
    permissions:
      contents: read
      pages: write

    env:
      QUARTOVERSION: ${{ inputs.quarto }}
      REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
      HAS_DOCS: ${{ needs.bump-version.outputs.has_docs }}

    outputs:
      summary: ${{ steps.deployment-summary.outputs.summary }}
      has_thumbnail: ${{ steps.stage-thumbnail.outputs.has_thumbnail }}

    steps:
      # The commit the bump merged as, rather than whatever the default branch
      # points at by now: a commit landing in between would otherwise be
      # rendered and released without ever having been part of the release.
      # The default token is enough to read the repository, and this job never
      # writes, so no App token is resolved here at all.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.merge_sha }}

      # Everything below this point runs code the released project controls:
      # dependency restores, executed chunks, and pre-render and post-render
      # scripts. The credentials the checkout left in .git/config are not
      # needed again by this job at all, so they go now.
      - name: Drop the git credentials before running project code
        shell: bash
        run: |
          # The key actions/checkout derives from the server it cloned from.
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true

          # An unset that matched nothing exits non-zero and would be swallowed
          # above, leaving the render holding a token. Fail loudly instead.
          if git config --local --name-only --get-regexp '^http\..*\.extraheader$'; then
            echo "::error::Credentials are still present in .git/config."
            exit 1
          fi
          echo "No credentials remain in .git/config."

      # The workflow's own actions and assets, read from the commit the caller
      # pinned rather than from a branch that moves under it. A local `uses: ./`
      # is resolved against the workspace, which is why they are checked out
      # into it, after the repository checkout that would otherwise clear them.
      # The assets are included because the slide conversion below reads a
      # script from them. The name is dot-prefixed so that Quarto leaves it out
      # of the render.
      - name: Checkout the workflow source
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quarto-workflows
          sparse-checkout: |
            .github/actions
            .github/workflows/assets
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "${{ env.QUARTOVERSION }}"
          tinytex: false

      - name: Detect project directory and configure
        id: detect-project-dir
        shell: bash
        run: |
          # Always the repository root. A documentation website under docs/ is
          # rendered and deployed by the Pages workflow instead, and the
          # root project then serves as a render check only.
          PROJECT_DIR="."
          echo "Using root as project directory"
          if [ "${HAS_DOCS}" = "true" ]; then
            echo "docs/_quarto.yml found: the root project is rendered as a check and not deployed."
          fi

          # Read project type and output directory from Quarto (resolves defaults)
          INSPECT_JSON=$(quarto inspect "${PROJECT_DIR}" 2>/dev/null || echo '{}')
          QUARTO_PROJECT_TYPE=$(echo "${INSPECT_JSON}" | jq -r '.config.project.type // "default"')
          OUTPUT_DIR=$(echo "${INSPECT_JSON}" | jq -r '.config.project["output-dir"] // empty')

          # Default project with no output-dir: fall back to _site and create a
          # minimal _quarto.yml only when none exists. Never overwrite existing config.
          if [ -z "${OUTPUT_DIR}" ]; then
            OUTPUT_DIR="_site"
            if [ ! -f "${PROJECT_DIR}/_quarto.yml" ]; then
              printf 'project:\n  output-dir: %s\n' "${OUTPUT_DIR}" > "${PROJECT_DIR}/_quarto.yml"
            fi
          fi

          OUTPUT_DIRECTORY="${OUTPUT_DIR}"

          # A documentation website under docs/ and Quarto test fixtures under
          # test/ or tests/ are Quarto projects of their own, but the root
          # project scan does not skip a subdirectory that has one. Left alone,
          # their pages are rendered a second time here, without the
          # configuration, theme, and extensions that make them work, and land
          # in the archive attached to the release. Exclude them, so this render
          # is the example check it claims to be.
          EXCLUDES=()
          if [ "${HAS_DOCS}" = "true" ]; then
            EXCLUDES+=("docs/")
          fi
          for dir in test tests; do
            if [ -d "${PROJECT_DIR}/${dir}" ] && find "${PROJECT_DIR}/${dir}" -name _quarto.yml -print -quit | grep -q .; then
              EXCLUDES+=("${dir}/")
            fi
          done
          # An exclusion-only list renders nothing, so a missing list needs an
          # include. Without docs/, the root render is the published site, so
          # it keeps Quarto's default inputs and the fixtures are not excluded.
          if [ "$(yq eval '.project.render' "${PROJECT_DIR}/_quarto.yml")" = "null" ]; then
            if [ "${HAS_DOCS}" = "true" ]; then
              yq eval -i '.project.render = ["*.qmd"]' "${PROJECT_DIR}/_quarto.yml"
            else
              EXCLUDES=()
            fi
          fi
          for exclude in "${EXCLUDES[@]}"; do
            if ! EXCLUDE="!${exclude}" yq eval -e '.project.render[] | select(. == strenv(EXCLUDE))' "${PROJECT_DIR}/_quarto.yml" >/dev/null 2>&1; then
              EXCLUDE="!${exclude}" yq eval -i '.project.render += [strenv(EXCLUDE)]' "${PROJECT_DIR}/_quarto.yml"
            fi
          done

          echo "Quarto project type: ${QUARTO_PROJECT_TYPE}"
          echo "Output directory: ${OUTPUT_DIRECTORY}"
          echo "_quarto.yml:"
          cat "${PROJECT_DIR}/_quarto.yml"
          {
            echo "project_dir=${PROJECT_DIR}"
            echo "output_directory=${OUTPUT_DIRECTORY}"
            echo "quarto_project_type=${QUARTO_PROJECT_TYPE}"
          } >> "${GITHUB_OUTPUT}"

      # Chrome is installed unconditionally here, since decktape drives it to
      # turn slides into PDF whatever the engines and formats turn out to be.
      - name: Set up compute environment
        id: compute
        uses: ./.quarto-workflows/.github/actions/setup-quarto-compute
        with:
          path: ${{ steps.detect-project-dir.outputs.project_dir }}
          chromium: "true"

      # A presentation repository converts every deck it renders, while an
      # extension only converts the decks that exercise the format it ships, so
      # plain `revealjs` output is left alone there.
      - name: Check decktape need
        id: check-decktape
        env:
          FORMATS: ${{ steps.compute.outputs.formats }}
        shell: bash
        run: |
          NEED_DECKTAPE=false
          if [ "${REPO_TYPE}" = "project" ]; then
            if echo "${FORMATS}" | grep -q "revealjs"; then
              NEED_DECKTAPE=true
            fi
          else
            for fmt in ${FORMATS}; do
              if echo "${fmt}" | grep -q "revealjs" && [ "${fmt}" != "revealjs" ]; then
                NEED_DECKTAPE=true
                break
              fi
            done
          fi

          echo "Need Decktape: ${NEED_DECKTAPE}"
          echo "need_decktape=${NEED_DECKTAPE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: ${{ steps.check-decktape.outputs.need_decktape == 'true' }}
        uses: actions/setup-node@v7

      - name: Exclude CHANGELOG.md from render
        env:
          PROJECT_DIR: ${{ steps.detect-project-dir.outputs.project_dir }}
          # The inputs detection already read, rather than a third inspection of
          # the same project. Nothing between the two steps touches _quarto.yml.
          INPUT_FILES: ${{ steps.compute.outputs.input-files }}
        shell: bash
        run: |
          QUARTO_YML="${PROJECT_DIR}/_quarto.yml"
          if [ ! -f "${PROJECT_DIR}/CHANGELOG.md" ]; then
            echo "No CHANGELOG.md in ${PROJECT_DIR}, nothing to exclude."
            exit 0
          fi
          if [ ! -f "${QUARTO_YML}" ]; then
            echo "No ${QUARTO_YML}, nothing to exclude."
            exit 0
          fi

          if yq eval '.project.render' "${QUARTO_YML}" | grep -q "null"; then
            # No render targets: rebuild the default input set minus CHANGELOG.md.
            # An exclusion-only list would render nothing, so we list includes explicitly.
            mapfile -t INPUTS < <(printf '%s\n' "${INPUT_FILES}" | sed '/^$/d')
            RENDER=()
            for f in "${INPUTS[@]}"; do
              rel=$(realpath --relative-to="${PROJECT_DIR}" "${f}")
              if [ "${rel}" = "CHANGELOG.md" ]; then
                continue
              fi
              RENDER+=("${rel}")
            done
            # Only write render targets when inputs were detected; an empty list
            # would render nothing, so leave _quarto.yml untouched in that case.
            if [ "${#RENDER[@]}" -gt 0 ]; then
              yq eval '.project.render = []' -i "${QUARTO_YML}"
              for rel in "${RENDER[@]}"; do
                yq eval ".project.render += [\"${rel}\"]" -i "${QUARTO_YML}"
              done
            else
              echo "No inputs were detected; leaving render targets unchanged."
            fi
          else
            # Render targets already defined: append the exclusion if not present.
            if ! yq eval '.project.render[] | select(. == "!CHANGELOG.md")' "${QUARTO_YML}" | grep -q "!CHANGELOG.md"; then
              yq eval '.project.render += ["!CHANGELOG.md"]' -i "${QUARTO_YML}"
            fi
          fi

          echo "Render targets after CHANGELOG.md exclusion:"
          cat "${QUARTO_YML}"

      - name: Render Quarto Project
        id: render-quarto
        env:
          PROJECT_DIR: ${{ steps.detect-project-dir.outputs.project_dir }}
          OUTPUT_DIRECTORY: ${{ steps.detect-project-dir.outputs.output_directory }}
          QUARTO_PROJECT_TYPE: ${{ steps.detect-project-dir.outputs.quarto_project_type }}
          REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
          FORMATS: ${{ steps.compute.outputs.formats }}
          NEED_DECKTAPE: ${{ steps.check-decktape.outputs.need_decktape }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          EXTENSION_NAME: ${{ needs.bump-version.outputs.extension_name }}
          ACTIONS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
          # Decktape drives Chrome through Puppeteer, which otherwise downloads
          # a Chromium of its own beside the one the compute action just proved
          # works on this runner.
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          if [ "${NEED_DECKTAPE}" = "true" ]; then
            npm install -g decktape

            # Add post-render script to _quarto.yml if not using docs/
            if [ "${PROJECT_DIR}" = "." ]; then
              SLIDES_SCRIPT=".quarto-workflows/.github/workflows/assets/slides-to-pdf.sh"
              if yq eval '.project.post-render' _quarto.yml | grep -q "null"; then
                yq eval ".project.post-render = [\"${SLIDES_SCRIPT}\"]" -i _quarto.yml
              else
                if ! yq eval ".project.post-render[] | select(. == \"${SLIDES_SCRIPT}\")" _quarto.yml | grep -q "${SLIDES_SCRIPT}"; then
                  yq eval ".project.post-render += [\"${SLIDES_SCRIPT}\"]" -i _quarto.yml
                fi
              fi
            fi
          fi

          echo "Final _quarto.yml:"
          cat "${PROJECT_DIR}/_quarto.yml"

          if [ "${ACTIONS_RUNNER_DEBUG}" = "true" ] || [ "${ACTIONS_STEP_DEBUG}" = "true" ]; then
            export QUARTO_DENO_V8_OPTIONS=--stack-trace-limit=100
            export QUARTO_PRINT_STACK=true
            export QUARTO_LOG_LEVEL=DEBUG
          fi

          # Non-default projects (website/book/...) render as a whole project.
          # Default projects render each detected format individually.
          if [ "${QUARTO_PROJECT_TYPE}" != "default" ]; then
            echo "::group::Rendering project (${QUARTO_PROJECT_TYPE})"
            quarto render "${PROJECT_DIR}"
            echo "::endgroup::"
          elif [ -n "${FORMATS}" ]; then
            for format in ${FORMATS}; do
              echo "::group::Rendering ${format}"
              quarto render "${PROJECT_DIR}" --to "${format}"
              echo "::endgroup::"
            done
          else
            echo "::group::Rendering (default)"
            quarto render "${PROJECT_DIR}"
            echo "::endgroup::"
          fi

          # Package rendered output. With a documentation website present this
          # is the rendered example rather than the published site, so it is
          # named for what it actually contains.
          if [ "${HAS_DOCS}" = "true" ]; then
            SITE_ARCHIVE="example-render.tar.gz"
          else
            SITE_ARCHIVE="gh-pages.tar.gz"
          fi
          tar -czf "${SITE_ARCHIVE}" -C "${OUTPUT_DIRECTORY}" .

          # The archive is the one asset every release has, so the list the
          # upload step reads is built from it outwards.
          ASSET_PATHS=("${SITE_ARCHIVE}")

          # Package _extensions/ if present (named as {extension}-v{version}.tar.gz and .zip)
          if [ "${REPO_TYPE}" = "extension" ] && [ -d "_extensions" ]; then
            ASSET_NAME="${EXTENSION_NAME}-v${VERSION}"
            tar -czf "${ASSET_NAME}.tar.gz" _extensions/
            zip -qr "${ASSET_NAME}.zip" _extensions/
            ASSET_PATHS+=("${ASSET_NAME}.tar.gz" "${ASSET_NAME}.zip")
          fi

          # The post-render script writes the slides assets, so the directory
          # existing is what says a deck was converted.
          SLIDES_EXISTS=false
          if [ -d "release_assets" ]; then
            SLIDES_EXISTS=true
            ASSET_PATHS+=("$(pwd)/release_assets")
          fi

          # A fixed delimiter is enough here, unlike the release notes above:
          # every element is a path this step just built.
          {
            echo "slides_assets_exists=${SLIDES_EXISTS}"
            echo "asset_paths<<ASSET_PATHS_DELIM"
            printf '%s\n' "${ASSET_PATHS[@]}"
            echo "ASSET_PATHS_DELIM"
          } >> "${GITHUB_OUTPUT}"

      # Skipped when the repository has a documentation website: the deploy-pages
      # job below publishes docs/ from the release tag instead, and the render
      # above was only a check. Without one, the rendered output is staged here
      # and publish-pages deploys it.
      - name: Configure GitHub Pages
        if: ${{ env.HAS_DOCS != 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        id: upload-artifact
        if: ${{ env.HAS_DOCS != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ steps.detect-project-dir.outputs.output_directory }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            ${{ steps.render-quarto.outputs.asset_paths }}

      # The rendered thumbnail is handed to the thumbnail job rather than pushed
      # from here, so that this job, which has just run the released project's
      # own code, needs no write of any kind. Staged under a directory of its
      # own, since the artifact is downloaded straight over .github/ there.
      - name: Stage the template thumbnail
        id: stage-thumbnail
        if: ${{ steps.render-quarto.outputs.slides_assets_exists == 'true' }}
        env:
          OUTPUT_DIRECTORY: ${{ steps.detect-project-dir.outputs.output_directory }}
        shell: bash
        run: |
          if [ -f "${OUTPUT_DIRECTORY}/index.png" ]; then
            mkdir -p .template-thumbnail
            mv -f "${OUTPUT_DIRECTORY}/index.png" .template-thumbnail/template.png
            HAS_THUMBNAIL=true
          else
            HAS_THUMBNAIL=false
            echo "No ${OUTPUT_DIRECTORY}/index.png; nothing to stage."
          fi
          echo "has_thumbnail=${HAS_THUMBNAIL}" >> "${GITHUB_OUTPUT}"

      - name: Upload the template thumbnail
        if: ${{ steps.stage-thumbnail.outputs.has_thumbnail == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: template-thumbnail
          path: .template-thumbnail/template.png
          retention-days: 1

      # Formats and engines are reported by the compute action itself, in this
      # job's own summary, so they are not repeated here.
      - name: Add deployment summary
        id: deployment-summary
        shell: bash
        run: |
          SUMMARY="## Deployment\n\n"
          SUMMARY+="| Field | Value |\n"
          SUMMARY+="|-------|--------|\n"
          SUMMARY+="| Quarto Version | \`${QUARTOVERSION}\` |\n"
          if [ "${HAS_DOCS}" = "true" ]; then
            SUMMARY+="| GitHub Pages | Deployed from \`docs/\` by the Pages workflow. |\n"
          else
            SUMMARY+="| GitHub Pages | Deployed by the Publish Pages job. |\n"
          fi
          echo "summary=${SUMMARY}" >> "${GITHUB_OUTPUT}"

  # The thumbnail a deck renders is committed back, which is the one write the
  # render used to make while holding the released project's code. It sits in a
  # job of its own so that render stays read-only, and so the token it pushes
  # with is resolved here, minutes rather than an hour after the release
  # started: a GitHub App installation token lasts an hour, and installing
  # runtimes and rendering can spend most of one.
  #
  # The thumbnail is not part of the release being cut, so a failure here
  # reports itself and lets the tag, the release, and the deployment go out.
  # Nothing depends on this job for the same reason.
  thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    needs: deploy

    if: ${{ needs.deploy.outputs.has_thumbnail == 'true' }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get the token
        uses: mcanouil/release-actions/token@v1
        id: token
        with:
          app-id: ${{ env.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      # The tip of the branch rather than the released commit: land opens the
      # pull request from a branch, and the thumbnail merges into whatever the
      # branch holds by now, the version bump included.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}
          ref: ${{ github.ref_name }}

      - name: Download the template thumbnail
        uses: actions/download-artifact@v8
        with:
          name: template-thumbnail
          path: .github

      # Not waited on: nothing after this job needs the merge. A thumbnail
      # identical to the committed one lands nothing.
      - name: Open the thumbnail pull request
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: .github/template.png
          message: "ci: update thumbs :art:"
          branch: ci/update-thumbs
          body: Regenerated `.github/template.png` from the rendered slides.
          wait: false
          allow-unchanged: true
          token: ${{ steps.token.outputs.token }}

  # A repository without docs/ publishes its rendered example or template to
  # Pages, as it always has. The deployment sits in its own job so the
  # github-pages environment is claimed only when something is deployed.
  publish-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - bump-version
      - deploy

    if: ${{ needs.bump-version.outputs.has_docs != 'true' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Pages deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|--------|"
            echo "| GitHub Pages URL | [${PAGE_URL}](${PAGE_URL}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - bump-version
      - deploy

    # The tag and the release itself.
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Get the token
        uses: mcanouil/release-actions/token@v1
        id: token
        with:
          app-id: ${{ env.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      # The same commit the deploy job rendered, and what the tag below points
      # at, so the render, the tag, and the release all describe one commit.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}
          ref: ${{ needs.bump-version.outputs.merge_sha }}

      # The install header of the release body, read from the commit the caller
      # pinned. After the checkout above, which would clear it.
      - name: Checkout the workflow assets
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quarto-workflows
          sparse-checkout: .github/workflows/assets
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download release assets
        id: download-release-assets-artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release_assets

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .release-notes

      # The release action reads each asset as a glob, with `#` starting its
      # label, so a file name holding `#`, `*`, `?`, `[` or `]` would not be
      # uploaded as itself.
      - name: List the release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=$(find release_assets -type f | sort)
          if BAD=$(grep -E '[]#*?[]' <<< "${ASSETS}"); then
            echo "::error::Asset file names cannot hold '#', '*', '?', '[' or ']': ${BAD//$'\n'/, }. Rename the rendered file."
            exit 1
          fi
          DELIM="ASSETS_$(openssl rand -hex 16)"
          {
            echo "assets<<${DELIM}"
            echo "${ASSETS}"
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: .release-notes/release-notes.md
          version: ${{ needs.bump-version.outputs.version }}
          tag: ${{ needs.bump-version.outputs.version }}
          target: ${{ needs.bump-version.outputs.merge_sha }}
          generate-notes: true
          header: ${{ inputs.notes-header || (needs.bump-version.outputs.repo_type == 'extension' && '.quarto-workflows/.github/workflows/assets/release-header-extension.md' || '') }}
          token: ${{ steps.token.outputs.token }}

      - name: Create the release
        id: release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ needs.bump-version.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          title: ${{ needs.bump-version.outputs.release_title }}
          date: ${{ needs.bump-version.outputs.date }}
          target: ${{ needs.bump-version.outputs.merge_sha }}
          assets: ${{ steps.assets.outputs.assets }}
          token: ${{ steps.token.outputs.token }}

      - name: Display workflow summary
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          BUMP_SUMMARY: ${{ needs.bump-version.outputs.summary }}
          DEPLOY_SUMMARY: ${{ needs.deploy.outputs.summary }}
          REPO_TYPE: ${{ needs.bump-version.outputs.repo_type }}
          EXTENSION: ${{ needs.bump-version.outputs.extension_name }}
        shell: bash
        run: |
          {
            echo "# Release Summary"
            echo ""
            echo "*Automated release completed successfully*"
            echo ""
            if [ "${REPO_TYPE}" = "extension" ]; then
              echo "### Extension Details"
              echo "- **Extension Name**: \`${EXTENSION}\`"
              echo "- **Version**: \`${VERSION}\`"
            else
              echo "### Project Details"
              echo "- **Version**: \`${VERSION}\`"
            fi
            echo ""
            echo "### Links"
            echo "- [GitHub Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
            # The Pages URL is written by whichever job deployed the site,
            # publish-pages or the Pages workflow, both of which run beside this
            # job rather than before it.
            echo ""
            echo "---"
            echo ""
            echo -e "${BUMP_SUMMARY}"
            echo ""
            echo -e "${DEPLOY_SUMMARY}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  # Publishes the documentation website from the tag the release job just
  # created, so the site describes the version users can install.
  deploy-pages:
    needs:
      - bump-version
      - release
    if: ${{ needs.bump-version.outputs.has_docs == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Relative, so the Pages workflow comes from the same commit as this file
    # rather than from a branch. `uses` accepts no expressions, so this is the
    # only form that follows whatever ref the caller pinned.
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.bump-version.outputs.version }}
      quarto: ${{ inputs.quarto }}
