name: Quarto Extensions Updates

# Runs on a schedule for this repository, and is callable by any repository that
# wants the same behaviour. Extension repositories call it with
# `scan-directories: docs`, because their documentation website keeps its own
# dependencies (atelier, iconify, gitlink) under docs/_extensions/.
on:
  workflow_dispatch:
  schedule:
    - cron: 00 12 1 * *
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: false
      APP_KEY:
        description: "GitHub App private key"
        required: false
    inputs:
      scan-directories:
        description: "Newline-separated directories to scan, in addition to the repository root"
        required: false
        default: ""
        type: string
      gh-app-id:
        description: "GitHub App ID"
        required: false
        type: string

# Keyed on the ref alone: the scheduled run and a dispatch of the same workflow
# would otherwise race over creating the same update pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quarto-extensions-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Git User
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@main
        id: setup-git-user
        with:
          gh-app-id: ${{ inputs.gh-app-id || vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions
        uses: mcanouil/quarto-extensions-updater@v2
        with:
          github-token: ${{ steps.setup-git-user.outputs.token }}
          pr-labels: "Type: Dependencies :arrow_up:"
          group-updates: true
          scan-directories: ${{ inputs.scan-directories }}
