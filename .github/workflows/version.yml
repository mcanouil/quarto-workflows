name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  contents: write

# Two runs at once would read the same latest tag and race over the rolling
# ones. Queue rather than cancel: a cancelled run can leave vX pushed while
# vX.Y.Z is not.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to tag anything but the default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${REF_NAME}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history and every tag, since the version to cut is derived
          # from the latest one.
          fetch-depth: 0

      - name: Setup Git User
        uses: ./.github/actions/setup-git-user
        id: setup-git-user
        with:
          gh-app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version to cut
        id: resolve-version
        env:
          BUMP: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # The repository carried no tags at all before the first cut, so an
          # empty result is seeded rather than treated as an error.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "${LATEST}" ]; then
            LATEST="v0.0.0"
            echo "No version tag found; seeding from ${LATEST}."
          else
            echo "Latest version tag: ${LATEST}"
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          case "${BUMP}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "::error::Unknown bump type '${BUMP}': expected patch, minor, or major."
              exit 1
              ;;
          esac

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::${VERSION} already exists."
            exit 1
          fi

          echo "Cutting ${VERSION}."
          {
            echo "version=${VERSION}"
            echo "major=v${MAJOR}"
            echo "minor=v${MAJOR}.${MINOR}"
            echo "previous=${LATEST}"
          } >> "${GITHUB_OUTPUT}"

      # The README tells callers which major to pin, and this workflow does not
      # push to the default branch, whose ruleset requires a pull request. A
      # major cut therefore lands its README change as an ordinary pull request
      # first, and this step is what makes forgetting that impossible.
      - name: Check the README pins the major being cut
        env:
          MAJOR: ${{ steps.resolve-version.outputs.major }}
        shell: bash
        run: |
          set -euo pipefail

          PINNED=$(grep -oE 'quarto-workflows/\.github/workflows/[a-z-]+\.yml@[^ ]+' README.md \
            | sed 's/.*@//' | sort -u || true)

          if [ -z "${PINNED}" ]; then
            echo "::error::No workflow reference found in README.md; expected the usage examples to pin ${MAJOR}."
            exit 1
          fi

          if [ "${PINNED}" != "${MAJOR}" ]; then
            echo "::error::README.md pins $(echo "${PINNED}" | tr '\n' ' ')but ${MAJOR} is being cut. Land a pull request repointing the usage examples at ${MAJOR}, then dispatch this workflow again."
            exit 1
          fi

          echo "README.md pins ${MAJOR}."

      - name: Tag the release
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          MAJOR: ${{ steps.resolve-version.outputs.major }}
          MINOR: ${{ steps.resolve-version.outputs.minor }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -a "${VERSION}" -m "${VERSION}"

          # The rolling tags are what callers actually pin, so they are moved on
          # to this commit. Only the exact version is immutable.
          git tag -f -a "${MINOR}" -m "${VERSION}"
          git tag -f -a "${MAJOR}" -m "${VERSION}"

          git push origin "${VERSION}"
          git push --force origin "${MINOR}" "${MAJOR}"

          echo "Tagged ${VERSION}, and moved ${MINOR} and ${MAJOR} on to it."

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
          VERSION: ${{ steps.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Only the exact version carries a release. The rolling tags are left
          # bare, which keeps them movable whatever the repository's release
          # immutability setting is.
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            --latest \
            --verify-tag

      - name: Add version summary
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          MAJOR: ${{ steps.resolve-version.outputs.major }}
          MINOR: ${{ steps.resolve-version.outputs.minor }}
          PREVIOUS: ${{ steps.resolve-version.outputs.previous }}
        shell: bash
        run: |
          {
            echo "## Version"
            echo ""
            echo "| Field | Value |"
            echo "|-------|--------|"
            echo "| Previous | \`${PREVIOUS}\` |"
            echo "| Released | \`${VERSION}\` |"
            echo "| Rolling | \`${MINOR}\`, \`${MAJOR}\` |"
            echo ""
            echo "[Release notes](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
          } >> "${GITHUB_STEP_SUMMARY}"
