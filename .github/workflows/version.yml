name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  contents: read

# Two runs at once would read the same latest tag and race over the rolling
# ones. Queue rather than cancel: a cancelled run can leave the bump pushed
# while the release is not.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Cut the release

    steps:
      # The App only, with no fallback token: the default token cannot pass the
      # pull request rule of the default branch, so a missing App stops the run
      # here, before anything is written.
      - name: Get the token
        uses: mcanouil/release-actions/token@v1
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history and every tag, since the version to cut is derived
          # from the latest one.
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          version-source: tag
          tag-prefix: v
          token: ${{ steps.token.outputs.token }}
          # The usage examples pin the major being cut. Each pattern names a
          # workflow of this repository, so pins such as actions/checkout@v7
          # stay as they are. A workflow newly documented in README.md needs
          # its own pattern here.
          targets: |
            - file: README.md
              pattern: 'mcanouil/quarto-workflows/.github/workflows/release.yml@v{major}'
            - file: README.md
              pattern: 'mcanouil/quarto-workflows/.github/workflows/pages.yml@v{major}'
            - file: README.md
              pattern: 'mcanouil/quarto-workflows/.github/workflows/quarto-extensions-updates.yml@v{major}'
            - file: README.md
              pattern: '^The current major is `v{major}`.$'

      # land stops a release dispatched from any branch but the default one,
      # before it commits. The App is exempt from the pull request rule of the
      # default branch, and the [skip ci] of the release message keeps CI from
      # running again on a tree it has checked.
      - name: Push the version
        id: push
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          version: ${{ steps.bump.outputs.version }}
          tag: v${{ steps.bump.outputs.version }}
          target: ${{ steps.push.outputs.sha }}
          generate-notes: true
          token: ${{ steps.token.outputs.token }}

      # The tags are lightweight, deliberately, and not to be turned into
      # annotated tags. `release.yml` calls the Pages workflow through a relative
      # reference, and GitHub does not peel an annotated tag to its commit when
      # it resolves one: a caller pinning an annotated tag fails the whole run
      # before a single job starts, with no error beyond "this run likely failed
      # because of a workflow file issue". The release action creates every tag
      # through the API, which makes lightweight tags only. Only the exact
      # version carries a release; the rolling tags stay bare and movable.
      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ steps.push.outputs.sha }}
          latest: true
          rolling: true
          token: ${{ steps.token.outputs.token }}
