name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  contents: read

# Two runs at once would read the same latest tag and race over the rolling
# ones. Queue rather than cancel: a cancelled run can leave the bump pushed
# while the release is not.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Cut the release

    steps:
      - name: Refuse to tag anything but the default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${REF_NAME}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history and every tag, since the version to cut is derived
          # from the latest one.
          fetch-depth: 0

      # The App only, with no fallback token: the default token cannot pass the
      # pull request rule of the default branch, so a missing App fails here,
      # before anything is written.
      - name: Setup Git User
        uses: ./.github/actions/setup-git-user
        id: setup-git-user
        with:
          gh-app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      # The same commit again, so the push below goes out as the App. The
      # action above stays on disk for its post step.
      - name: Checkout repository as the App
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.setup-git-user.outputs.token }}

      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          version-source: tag
          tag-prefix: v

      # The README tells callers which major to pin, and a @v{major} target
      # would also rewrite pins such as actions/checkout@v7. A major cut
      # therefore lands its README change as an ordinary pull request first, and
      # this step makes forgetting that impossible.
      - name: Check the README pins the major being cut
        env:
          MAJOR: v${{ steps.bump.outputs.major }}
        shell: bash
        run: |
          set -euo pipefail

          PINNED=$(grep -oE 'quarto-workflows/\.github/workflows/[a-z-]+\.yml@[^ ]+' README.md \
            | sed 's/.*@//' | sort -u || true)

          if [ -z "${PINNED}" ]; then
            echo "::error::No workflow reference found in README.md; expected the usage examples to pin ${MAJOR}."
            exit 1
          fi

          if [ "${PINNED}" != "${MAJOR}" ]; then
            echo "::error::README.md pins $(echo "${PINNED}" | tr '\n' ' ')but ${MAJOR} is being cut. Land a pull request repointing the usage examples at ${MAJOR}, then dispatch this workflow again."
            exit 1
          fi

          echo "README.md pins ${MAJOR}."

      # The release step refuses an existing tag or release too, but only after
      # the push, which would leave the bump on the default branch.
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
          TAG: v${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists. Delete it, or create its release by hand, then dispatch this workflow again."
            exit 1
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::error::A release ${TAG} already exists, perhaps as a draft. Delete it, then dispatch this workflow again."
            exit 1
          fi

      # The App is exempt from the pull request rule of the default branch, and
      # [skip ci] keeps CI from running again on a tree it has checked.
      - name: Push the version
        id: push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          FILES: ${{ steps.bump.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${FILES}" | git add --pathspec-from-file=-
          git commit -m "ci: release v${VERSION} [skip ci]"
          if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "::error::The App could not push the bump to ${GITHUB_REF_NAME}. If the push output says the branch moved, dispatch this workflow again; otherwise add the App to the bypass list of the branch ruleset first."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          version: ${{ steps.bump.outputs.version }}
          tag: v${{ steps.bump.outputs.version }}
          target: ${{ steps.push.outputs.sha }}
          generate-notes: true
          token: ${{ steps.setup-git-user.outputs.token }}

      # The tags are lightweight, deliberately, and not to be turned into
      # annotated tags. `release.yml` calls the Pages workflow through a relative
      # reference, and GitHub does not peel an annotated tag to its commit when
      # it resolves one: a caller pinning an annotated tag fails the whole run
      # before a single job starts, with no error beyond "this run likely failed
      # because of a workflow file issue". The release action creates every tag
      # through the API, which makes lightweight tags only. Only the exact
      # version carries a release; the rolling tags stay bare and movable.
      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ steps.push.outputs.sha }}
          latest: true
          rolling: true
          token: ${{ steps.setup-git-user.outputs.token }}

      # A new dispatch would stop on the emptied Unreleased section, and then on
      # the existing changelog heading, so the pushed bump has to go first.
      - name: Explain the recovery
        if: ${{ failure() && steps.push.outputs.sha != '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        shell: bash
        run: |
          echo "::error::${GITHUB_REF_NAME} holds the bump ${SHA} for v${VERSION}, but the run failed after the push. If release v${VERSION} does not exist, revert that commit with a pull request, then dispatch this workflow again. If it exists, only the rolling tags are missing: move them to ${SHA} by hand."
