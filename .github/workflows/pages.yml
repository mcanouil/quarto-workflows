name: Pages

# Publishes the documentation website under docs/, or the Quarto project a
# caller names with `path`. The site under docs/ is what a repository
# serves from GitHub Pages once it has one: it takes the slot the rendered
# example.qmd or template.qmd used to fill. The Release workflow calls this
# after tagging, and it is dispatchable on its own. Pull requests render the
# site as a check, from their own head, but never deploy, and a draft renders
# nothing at all.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or ref to build. Defaults to the latest version tag."
        type: string
        required: false
        default: ""
      use-main-as-release:
        description: "Render from the triggering ref instead of the latest version tag."
        type: boolean
        required: false
        default: false
      quarto:
        description: "Quarto version: auto, release, pre-release, or a version number"
        type: string
        required: false
        default: "auto"
      path:
        description: "Quarto project directory to render and deploy, relative to the repository root."
        type: string
        required: false
        default: "docs"
  workflow_dispatch:
    inputs:
      use-main-as-release:
        description: "Render from the default branch instead of the latest version tag"
        type: boolean
        default: false
      quarto:
        type: choice
        description: "Quarto version"
        default: "auto"
        options:
          - "auto"
          - "release"
          - "pre-release"

# Only the deploy job touches Pages, and it raises its own permissions.
permissions:
  contents: read

# Pages accepts one deployment at a time, so queue rather than cancel. Pull
# requests never deploy, so they get a per-ref group and can run in parallel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Render site
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # A draft pull request is not asking for a check yet, and this render
    # installs whichever runtimes the site executes with. `github.event` is the
    # caller's event, so a dispatch or a release call leaves `pull_request`
    # null and the job runs. A caller triggered by `pull_request` has to list
    # `ready_for_review` among its `types`, since the default set fires nothing
    # when a pull request leaves draft.
    if: ${{ github.event.pull_request.draft != true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history only when the latest version tag is resolved below.
          # Every other run renders the ref it was given, so it takes the shallow
          # clone: a site whose history is large would otherwise pay for all of
          # it on every deploy.
          # The shallow case comes first because 0 is falsy in an expression, so
          # `cond && 0 || 1` would always yield 1.
          fetch-depth: ${{ (inputs.ref != '' || inputs.use-main-as-release || github.event_name == 'pull_request') && 1 || 0 }}
          ref: ${{ inputs.ref }}

      # A pull request renders its own head, so a broken page is caught before
      # it lands. Everything else renders the released source, so the published
      # site describes the version users can actually install.
      - name: Resolve the ref to render
        id: resolve-ref
        if: ${{ inputs.ref == '' && !inputs.use-main-as-release && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l --sort=-v:refname '[0-9]*' | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            echo "::warning::No version tags found; rendering the triggering ref instead."
            exit 0
          fi
          echo "Latest tag: ${LATEST_TAG}"
          git checkout "${LATEST_TAG}"

      # The compute action lives beside this workflow, so it is read from the
      # commit the caller pinned rather than from a branch that moves under it.
      # A local `uses: ./` is resolved against the workspace, which is why it is
      # checked out into one, under a name Quarto leaves out of the render. It
      # comes after the repository checkout above, which would otherwise clear
      # it.
      - name: Checkout the workflow source
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quarto-workflows
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Quarto builds its extension registry while reading _quarto.yml, before
      # any pre-render script runs, and it does not follow symlinks. A shortcode
      # contributed by the repository's own extension is therefore only found
      # when a real copy is already on disk, so the mirror is refreshed here
      # rather than left to whatever was last committed.
      - name: Sync the repository's extension into the site
        shell: bash
        env:
          SITE_PATH: ${{ inputs.path || 'docs' }}
        run: |
          SITE_PATH="${SITE_PATH%/}"
          SYNC_SCRIPT="./${SITE_PATH}/_scripts/sync-extension.sh"
          if [ -x "${SYNC_SCRIPT}" ]; then
            "${SYNC_SCRIPT}"
          elif [ -f "${SYNC_SCRIPT}" ]; then
            bash "${SYNC_SCRIPT}"
          else
            echo "No ${SYNC_SCRIPT}; nothing to sync."
          fi

      # `auto` follows the extensions the site installs, so that one whose
      # quarto-required only a pre-release meets does not fail the render. It
      # runs after the sync above because the sync can add or refresh the
      # repository's own extension in the site, and the choice has to see it.
      # The sync needs no Quarto, so nothing is lost by resolving after it.
      - name: Resolve the Quarto version
        id: quarto-version
        uses: ./.quarto-workflows/.github/actions/resolve-quarto-version
        with:
          quarto: ${{ inputs.quarto || 'auto' }}
          path: ${{ inputs.path || 'docs' }}

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto-version.outputs.version }}

      # Documentation pages execute code, so the runtimes behind the engines the
      # site actually uses are installed here rather than assumed. The extension
      # mirror above has to exist first, since inspecting the project resolves
      # the extensions it declares.
      - name: Set up compute environment
        id: compute
        uses: ./.quarto-workflows/.github/actions/setup-quarto-compute
        with:
          path: ${{ inputs.path || 'docs' }}

      - name: Render site
        id: render
        shell: bash
        env:
          SITE_PATH: ${{ inputs.path || 'docs' }}
        run: |
          SITE_PATH="${SITE_PATH%/}"
          quarto render "${SITE_PATH}"
          echo "site=${SITE_PATH}/_site" >> "${GITHUB_OUTPUT}"

      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ steps.render.outputs.site }}
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - name: Prepare site for deployment
        run: touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: "./_site"

      # deploy-pages looks for the artefact once, with no retry, and the
      # artefact list can lag behind the upload (actions/deploy-pages#451).
      # This step reads the same list with the same token until the artefact
      # is in it, so it needs no permission that callers do not grant already.
      - name: Wait for the Pages artefact
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.ARTIFACT_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = (claims.scp ?? '').split(' ').find((s) => s.startsWith('Actions.Results:'));
            if (!scope) {
              core.setFailed('The runtime token has no Actions.Results scope, so the artefact list cannot be read.');
              return;
            }
            const [, runId, jobId] = scope.split(':');
            const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', process.env.ACTIONS_RESULTS_URL);
            const body = JSON.stringify({ workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId });
            const checks = 30;
            for (let check = 1; check <= checks; check++) {
              const response = await fetch(url, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body,
              });
              if (!response.ok) {
                core.setFailed(`Listing the artefacts failed with HTTP ${response.status}: ${await response.text()}`);
                return;
              }
              const { artifacts = [] } = await response.json();
              if (artifacts.some((artifact) => artifact.name === name)) {
                core.info(`${name} is listed after ${check} check(s).`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            core.setFailed(`${name} is still not listed after ${checks} checks. Re-run the job.`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Add deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Documentation deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|--------|"
            echo "| GitHub Pages URL | [${PAGE_URL}](${PAGE_URL}) |"
          } >> "${GITHUB_STEP_SUMMARY}"
